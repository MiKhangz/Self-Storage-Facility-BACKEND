[workspace]
resolver = "2"
members = [
    "crates/vietqr",
    "crates/payments-core",
    "crates/payments-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["StorEase Team"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
